<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" href="{% static 'images/favicon.ico' %}">

</head>

        <a href="/">Home</a>

    <!--The following code is for the conformation pop-up-->
    <div id="deleteModal"  class="modal-overlay">
        <div class="dltMDL">
            <div class="dltmodal-text">
                <h3>Are you sure you want to delete?</h3>
            </div>
            <div class="dltmodal-btn">
                <a href="#" class="conf_del" id="confirmDeleteBtn">Yes, Delete</a>

            </div>
        </div>
    </div>
